# Dedicated Postgres for the test suite (see doc/TESTING.md).
#
# Deliberately separate from the dev stack in docker/db/:
#   * a different port from the dev stack, so both can run at the same time
#   * different database (base_api_test) so tests can never touch dev data
#   * no volume: `docker compose down` discards the data -> a clean slate
#   * credentials stay pinned here, so tests never touch dev credentials.
#     Only the published port comes from the repo-root .env, and under its
#     own key (TEST_DB_PORT), so pointing DB_PORT at dev cannot redirect
#     the tests.  The Makefile passes it:  --env-file .env

services:

  db:
    # Same image as the dev stack (docker/db/docker-compose.yml).
    image: postgres
    container_name: base-db-test
    shm_size: 128mb
    environment:
      POSTGRES_USER: api
      POSTGRES_PASSWORD: test
      POSTGRES_DB: base_api_test
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-5433}:5432"
